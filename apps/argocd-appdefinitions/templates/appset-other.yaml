apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-other
  namespace: {{ .Values.argocdNamespace }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "4"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - list:
      elements:
      - chartName: rancher
        repoURL: https://github.com/lexi-blanchet/k3s-lab-apps.git
        path: apps/other/rancher
        revision: {{ .Values.defaultTargetRevision }}
        namespace: cattle-system
        syncWave: 3
        server: https://kubernetes.default.svc
  template:
    metadata:
      name: "{{`{{.chartName}}`}}"
      namespace: {{ .Values.argocdNamespace }}
      annotations:
        argocd.argoproj.io/sync-wave: "{{`{{ .syncWave | quote }}`}}"
    spec:
      project: "default"
      source:
        repoURL: "{{`{{.repoURL}}`}}"
        targetRevision: "{{`{{.revision}}`}}"
        path: "{{`{{.path}}`}}"
      destination:
        server: "{{`{{.server}}`}}"
        namespace: "{{`{{.namespace}}`}}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        automated:
          prune: true
          selfHeal: true
